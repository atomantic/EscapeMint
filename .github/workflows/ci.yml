name: CI

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Skip if commit message contains [skip ci]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for peer dependency conflicts
        run: |
          set +e
          npm_ls_output="$(npm ls --all 2>&1)"
          npm_ls_status=$?
          set -e
          if [ "$npm_ls_status" -ne 0 ]; then
            echo "$npm_ls_output"
            echo "npm ls reported dependency issues (exit code $npm_ls_status)."
            exit "$npm_ls_status"
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
